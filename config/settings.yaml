# 运行配置。环境变量可覆盖部分字段（见 README）。

fetch:
  # docker : 在能访问 Docker 的机器上执行 `docker exec <container> curl ...`
  # direct : 从当前机器直接发送 HTTP 请求
  mode: direct
  url: ""  # 在本地配置，或通过 AES_FETCH_URL 设置
  container: fetch-proxy
  # 如需在其他机器上执行 Docker 命令，可配置 ["ssh", "user@host"]
  ssh_prefix: []
  timeout_seconds: 60
  raw_dir: data/raw

preprocess:
  # 同一发送人、同一内容在该秒数内重复出现视为 OCR 重复采集
  dedup_window_seconds: 600
  # 被视为噪声的短消息（完全匹配，去首尾空白后）
  noise_messages: ["1", "好", "好的", "收到", "嗯", "嗯嗯", "ok", "OK", "Ok", "稍等", "是的", "在的", "谢谢", "感谢", "[抱拳]", "[OK]", "[捂脸]"]
  mask_secrets: true

segment:
  # 同一群内相邻消息间隔超过该分钟数则切分为新窗口
  gap_minutes: 30
  max_messages: 60
  max_chars: 12000
  # 窗口之间重叠的消息数（保留上下文）
  overlap: 3

llm:
  # claude   : Anthropic SDK + 结构化输出（需要 ANTHROPIC_API_KEY）
  # deepseek : OpenAI 兼容接口（需要 DEEPSEEK_API_KEY，地址见下方或 DEEPSEEK_BASE_URL）
  # 环境变量 AES_LLM_PROVIDER 可覆盖；AES_MODEL 作用于当前 provider
  provider: claude
  model: claude-opus-5-5
  effort: medium          # low | medium | high | xhigh | max
  max_tokens: 16000
  concurrency: 4
  # 拒答时服务端自动回退到其他模型（Claude API 一方接口支持）；设为 false 关闭
  server_side_fallback: true
  deepseek:
    base_url: https://api.deepseek.com/v1
    model: deepseek-chat
    max_tokens: 8000
    temperature: 0
    timeout_seconds: 300
    retries: 3
    # 开启 JSON 模式；网关不支持时会自动关闭重试
    json_mode: true

privacy:
  # 送给模型前把人名（群成员昵称、@提及）换成「员工A / 客户B」等代号，结果再换回真名
  pseudonymize_names: true
  # 群名里通常有客户公司名，送给模型时换成「客户群 <UID>」
  mask_group_names: true

sync:
  # aes sync 每次处理最近几天（今天 + 昨天，覆盖跨零点和晚到的消息）
  days: 2
  # 结果、原始文件和窗口缓存保留天数
  keep_days: 30
  # 单次最多调用模型的窗口数，超出部分留到下次（优先处理最近的对话）
  max_windows_per_run: 500
  cache_dir: data/windows
  out_file: out/live/events.jsonl
  status_file: data/sync_status.json

merge:
  # 同群、同类型事件在该小时数内且标题相似则合并
  window_hours: 72
  title_similarity: 0.55
