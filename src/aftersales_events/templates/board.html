<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>__AES_TITLE__</title>
<style>
:root {
  --bg: #ffffff; --sidebar: #f7f7f8; --panel: #ffffff; --hover: #f1f1f3; --active: #e9e9ec;
  --border: #ececf0; --border-2: #dedee3; --text: #1b1b1f; --text-2: #3d3d44; --muted: #85858d; --faint: #b4b4bb;
  --accent: #5e6ad2; --accent-soft: rgba(94,106,210,.12); --on-accent: #ffffff;
  --s-new: #8a8a93; --s-prog: #e0a400; --s-done: #5e6ad2; --s-closed: #a9a9b1; --urgent: #f2555a; --warn: #c27a00;
  --pop-shadow: 0 0 0 1px rgba(0,0,0,.07), 0 8px 28px rgba(0,0,0,.12), 0 2px 6px rgba(0,0,0,.06);
  --row-sel: rgba(94,106,210,.08);
  --t0: #5e6ad2; --t1: #eb5757; --t2: #9b51e0; --t3: #0fa5a0; --t4: #f2994a; --t5: #d6409f; --t6: #4cb782; --t7: #8a8a93;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101012; --sidebar: #0b0b0d; --panel: #141417; --hover: #1b1b1f; --active: #232328;
    --border: #1f1f24; --border-2: #2b2b31; --text: #ededf0; --text-2: #c6c6cc; --muted: #7d7d86; --faint: #4a4a52;
    --accent: #7c85f0; --accent-soft: rgba(124,133,240,.16); --on-accent: #0b0b0d;
    --s-new: #8f8f98; --s-prog: #f2c94c; --s-done: #7c85f0; --s-closed: #5d5d66; --urgent: #ff6b6b; --warn: #e5a83a;
    --pop-shadow: 0 0 0 1px rgba(255,255,255,.07), 0 10px 32px rgba(0,0,0,.55);
    --row-sel: rgba(124,133,240,.12);
    --t0: #7c85f0; --t1: #ff7a7a; --t2: #b98af0; --t3: #3ccfc8; --t4: #f5ab6b; --t5: #ef77bd; --t6: #6fd39f; --t7: #8f8f98;
  }
}
:root[data-theme="dark"] {
  --bg: #101012; --sidebar: #0b0b0d; --panel: #141417; --hover: #1b1b1f; --active: #232328;
  --border: #1f1f24; --border-2: #2b2b31; --text: #ededf0; --text-2: #c6c6cc; --muted: #7d7d86; --faint: #4a4a52;
  --accent: #7c85f0; --accent-soft: rgba(124,133,240,.16); --on-accent: #0b0b0d;
  --s-new: #8f8f98; --s-prog: #f2c94c; --s-done: #7c85f0; --s-closed: #5d5d66; --urgent: #ff6b6b; --warn: #e5a83a;
  --pop-shadow: 0 0 0 1px rgba(255,255,255,.07), 0 10px 32px rgba(0,0,0,.55);
  --row-sel: rgba(124,133,240,.12);
  --t0: #7c85f0; --t1: #ff7a7a; --t2: #b98af0; --t3: #3ccfc8; --t4: #f5ab6b; --t5: #ef77bd; --t6: #6fd39f; --t7: #8f8f98;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text); overflow: hidden;
  font: 13px/1.5 "Inter", "Inter var", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01";
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
svg { display: block; flex: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; border-radius: 4px; }
.muted { color: var(--muted); }

.app { display: grid; grid-template-columns: 232px 1fr; height: 100vh; height: 100dvh; }

/* ---------------------------------------------------------------- sidebar */
.sidebar { background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.ws { display: flex; align-items: center; gap: 8px; padding: 12px 14px 10px; }
.ws .logo { width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(135deg, var(--accent), var(--t2)); color: #fff; display: grid; place-items: center; font-size: 12px; font-weight: 700; }
.ws .name { font-weight: 600; font-size: 13.5px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-scroll { overflow-y: auto; padding: 4px 8px 12px; flex: 1; min-height: 0; }
.nav-sec { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; font-weight: 500; padding: 14px 8px 4px; }
.nav-item {
  display: flex; align-items: center; gap: 9px; width: 100%; padding: 0 8px; height: 28px; border-radius: 6px;
  color: var(--text-2); text-align: left; font-size: 13px;
}
.nav-item:hover { background: var(--hover); }
.nav-item[aria-current="true"] { background: var(--active); color: var(--text); font-weight: 500; }
.nav-item .lab { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav-item .n { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.nav-item .ico { width: 16px; display: grid; place-items: center; color: var(--muted); }
.side-foot { border-top: 1px solid var(--border); padding: 8px 10px; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.side-foot .sync { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-foot .dotlive { width: 6px; height: 6px; border-radius: 50%; background: var(--t6); flex: none; }
.side-foot .dotlive.off { background: var(--faint); }
.side-foot .dotlive.warn { background: var(--urgent); }
.side-foot { flex-direction: column; align-items: stretch; gap: 3px; }

/* ---------------------------------------------------------------- main */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar { height: 46px; display: flex; align-items: center; gap: 8px; padding: 0 12px 0 18px; border-bottom: 1px solid var(--border); flex: none; }
.crumb { display: flex; align-items: center; gap: 6px; font-weight: 500; min-width: 0; white-space: nowrap; }
.crumb .count { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
#view-name { display: inline-flex; align-items: center; gap: 4px; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.spacer { flex: 1; }
.search { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg); width: 240px; color: var(--muted); }
.search:focus-within { border-color: var(--accent); }
.search input { border: 0; background: transparent; outline: 0; flex: 1; min-width: 0; color: var(--text); }
.kbd { font-size: 11px; color: var(--muted); border: 1px solid var(--border-2); border-radius: 4px; padding: 0 4px; line-height: 16px; font-family: inherit; }
.btn { height: 28px; padding: 0 10px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; color: var(--text-2); border: 1px solid var(--border-2); background: var(--panel); white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--hover); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.seg { display: inline-flex; border: 1px solid var(--border-2); border-radius: 6px; padding: 2px; gap: 2px; }
.seg button { height: 22px; padding: 0 6px; border-radius: 4px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; }
.seg button[aria-pressed="true"] { background: var(--active); color: var(--text); }
.icon-btn { width: 28px; height: 28px; border-radius: 6px; display: grid; place-items: center; color: var(--muted); }
.icon-btn:hover { background: var(--hover); color: var(--text); }
.only-mobile { display: none; }

.filterbar { display: flex; align-items: center; gap: 6px; padding: 7px 12px 7px 18px; border-bottom: 1px solid var(--border); flex-wrap: wrap; flex: none; }
.fchip { display: inline-flex; align-items: stretch; height: 24px; border: 1px solid var(--border-2); border-radius: 6px; overflow: hidden; font-size: 12px; background: var(--panel); }
.fchip > * { display: inline-flex; align-items: center; gap: 5px; padding: 0 7px; }
.fchip .k { color: var(--muted); }
.fchip .op { color: var(--muted); padding: 0 2px; }
.fchip .v { border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
.fchip button:hover { background: var(--hover); }
.fadd { height: 24px; padding: 0 8px; border-radius: 6px; display: inline-flex; align-items: center; gap: 5px; color: var(--muted); font-size: 12px; }
.fadd:hover { background: var(--hover); color: var(--text); }
.stats { margin-left: auto; display: flex; gap: 14px; color: var(--muted); font-size: 12px; white-space: nowrap; }
.stats b { color: var(--text-2); font-weight: 600; font-variant-numeric: tabular-nums; }
.stats .hot b { color: var(--urgent); }

.content { flex: 1; min-height: 0; overflow: auto; position: relative; }

/* ---------------------------------------------------------------- list */
.ghead {
  position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 18px 0 12px;
  background: var(--sidebar); border-bottom: 1px solid var(--border); font-weight: 500; cursor: pointer; user-select: none;
}
.ghead .caret { width: 16px; height: 16px; display: grid; place-items: center; color: var(--muted); transition: transform .12s; }
.ghead.closed .caret { transform: rotate(-90deg); }
.ghead .gcount { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.row {
  display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 18px 0 22px; border-bottom: 1px solid var(--border);
  cursor: default; outline: none;
}
.row:hover { background: var(--hover); }
.row.cur { background: var(--row-sel); box-shadow: inset 2px 0 0 var(--accent); }
.ib { width: 22px; height: 22px; border-radius: 5px; display: grid; place-items: center; color: var(--muted); flex: none; }
.ib:hover { background: var(--active); }
.ident { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; width: 62px; flex: none; white-space: nowrap; }
.rtitle { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; color: var(--text); }
.rtitle .sub { color: var(--muted); font-weight: 400; margin-left: 8px; }
.mod { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); margin-left: 6px; vertical-align: middle; }
.rmeta { display: flex; align-items: center; gap: 8px; flex: none; }
.lbl { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border: 1px solid var(--border-2); border-radius: 999px; font-size: 12px; color: var(--text-2); white-space: nowrap; max-width: 200px; }
.lbl .t { overflow: hidden; text-overflow: ellipsis; }
.lbl.plain { border-color: transparent; color: var(--muted); padding: 0 2px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); flex: none; }
.date { color: var(--muted); font-size: 12px; width: 58px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.date.stale { color: var(--warn); }
.av { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 10.5px; font-weight: 600; color: #fff; background: hsl(var(--h) 52% 52%); flex: none; }
.av.lg { width: 22px; height: 22px; font-size: 11px; }

.empty { display: grid; place-items: center; text-align: center; color: var(--muted); padding: 80px 20px; gap: 10px; }
.empty h3 { margin: 0; color: var(--text); font-size: 14px; font-weight: 600; }
.empty p { margin: 0; max-width: 360px; }

/* ---------------------------------------------------------------- groups */
.gt-head, .gt-row { display: grid; grid-template-columns: minmax(220px, 1fr) 128px minmax(120px, 240px) 120px 92px; align-items: center; gap: 12px; padding: 0 18px 0 22px; }
.gt-head { position: sticky; top: 0; z-index: 2; height: 34px; background: var(--sidebar); border-bottom: 1px solid var(--border); color: var(--muted); font-size: 12px; }
.gt-row { height: 44px; border-bottom: 1px solid var(--border); cursor: pointer; }
.gt-row:hover { background: var(--hover); }
.gt-name { display: flex; align-items: center; gap: 10px; min-width: 0; }
.gt-name .t { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gav { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; font-size: 11px; font-weight: 600; color: #fff; background: hsl(var(--h) 45% 50%); flex: none; }
.gt-open { display: flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; }
.gt-open b { font-weight: 600; }
.gt-types { display: flex; gap: 8px; flex-wrap: nowrap; overflow: hidden; color: var(--muted); font-size: 12px; }
.gt-types span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.gt-msgs, .gt-last { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.gt-last.hot { color: var(--text-2); }
.gseg { display: inline-flex; gap: 2px; }
.gseg button { height: 24px; padding: 0 8px; border-radius: 6px; color: var(--muted); font-size: 12px; }
.gseg button:hover { background: var(--hover); }
.gseg button[aria-pressed="true"] { background: var(--active); color: var(--text); }
.gsort { height: 24px; border: 1px solid var(--border-2); border-radius: 6px; background: var(--bg); font-size: 12px; padding: 0 4px; }

/* ---------------------------------------------------------------- chat */
.chat { max-width: 920px; margin: 0 auto; padding: 8px 24px 60px; }
.cday { position: sticky; top: 0; z-index: 2; text-align: center; padding: 10px 0 6px; background: var(--bg); color: var(--muted); font-size: 12px; }
.cmsg { display: flex; gap: 10px; padding: 6px 10px; border-radius: 8px; border-left: 2px solid transparent; }
.cmsg:hover { background: var(--hover); }
.cmsg.cont { padding-top: 0; }
.cmsg.cont .av { visibility: hidden; height: 0; }
.cmsg.ev { border-left-color: var(--accent); background: var(--accent-soft); }
.cmsg.flash { animation: flash 1.6s ease; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 2px var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
.cmsg .cb { flex: 1; min-width: 0; }
.cmsg .ch { display: flex; gap: 8px; align-items: baseline; font-size: 12px; color: var(--muted); }
.cmsg .ch b { color: var(--text); font-weight: 600; font-size: 13px; }
.cmsg .ch .role { font-size: 11px; padding: 0 5px; border-radius: 4px; background: var(--active); }
.cmsg .ch .role.in { background: var(--accent-soft); color: var(--accent); }
.cmsg .cc { white-space: pre-wrap; word-break: break-word; line-height: 1.6; }
.cmsg .cc a { color: var(--accent); }
.cmsg .cc .img { color: var(--muted); font-style: italic; }
.cmsg mark { background: rgba(242,201,76,.45); color: inherit; border-radius: 2px; }
.cev { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
.cev button { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border: 1px solid var(--border-2); border-radius: 999px; font-size: 12px; background: var(--panel); }
.cev button:hover { border-color: var(--accent); }
.cbar-date { height: 24px; border: 1px solid var(--border-2); border-radius: 6px; background: var(--bg); padding: 0 6px; font-size: 12px; }
.chat-btn { opacity: 0; }
.gt-row:hover .chat-btn, .chat-btn:focus-visible { opacity: 1; }

/* ---------------------------------------------------------------- settings */
.settings { max-width: 720px; margin: 0 auto; padding: 32px 24px 60px; }
.settings h2 { font-size: 16px; margin: 0 0 4px; font-weight: 600; }
.settings h2:not(:first-child) { margin-top: 36px; }
.settings .desc { color: var(--muted); margin: 0 0 14px; }
.scard { border: 1px solid var(--border-2); border-radius: 10px; background: var(--panel); }
.srow { display: flex; align-items: center; gap: 16px; padding: 12px 16px; border-bottom: 1px solid var(--border); min-height: 52px; }
.srow:last-child { border-bottom: 0; }
.srow > .k { width: 120px; flex: none; color: var(--muted); }
.srow > .v { flex: 1; min-width: 0; word-break: break-word; }
.srow select, .srow input[type=text] { height: 30px; border: 1px solid var(--border-2); border-radius: 6px; background: var(--bg); padding: 0 8px; min-width: 220px; max-width: 100%; }
.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 12px; }
.pill.warn { background: rgba(229,168,58,.15); color: var(--warn); }
.pill.bad { background: rgba(242,85,90,.12); color: var(--urgent); }
.slog { list-style: none; margin: 8px 0 0; padding: 0; }
.slog li { padding: 6px 0; color: var(--muted); font-size: 12px; border-bottom: 1px dashed var(--border); }
.slog li b { color: var(--text-2); font-weight: 500; }

/* ---------------------------------------------------------------- board */
.kanban { display: flex; gap: 10px; padding: 12px 18px 18px; height: 100%; align-items: flex-start; min-width: min-content; }
.kcol { width: 300px; flex: none; display: flex; flex-direction: column; max-height: 100%; border-radius: 8px; }
.kcol.drop { background: var(--accent-soft); }
.khead { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 6px; font-weight: 500; flex: none; }
.khead .gcount { color: var(--muted); font-weight: 400; }
.klist { overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 2px 2px 8px; min-height: 60px; }
.kcard {
  background: var(--panel); border: 1px solid var(--border-2); border-radius: 8px; padding: 10px 12px; cursor: default;
  box-shadow: 0 1px 1px rgba(0,0,0,.03); display: flex; flex-direction: column; gap: 6px;
}
.kcard:hover { border-color: var(--faint); }
.kcard.cur { border-color: var(--accent); }
.kcard.dragging { opacity: .4; }
.kcard .k1 { display: flex; align-items: center; gap: 6px; }
.kcard .k1 .ident { width: auto; }
.kcard .k2 { display: flex; gap: 7px; align-items: flex-start; font-weight: 500; line-height: 1.4; word-break: break-word; }
.kcard .k2 svg { margin-top: 2px; }
.kcard .k3 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.kcard .k3 .ib { border: 1px solid var(--border-2); }
.kempty { color: var(--faint); font-size: 12px; text-align: center; padding: 14px 0; border: 1px dashed var(--border-2); border-radius: 8px; }

/* ---------------------------------------------------------------- peek */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.18); opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 20; }
.scrim.on { opacity: 1; pointer-events: auto; }
.peek {
  position: fixed; top: 8px; right: 8px; bottom: 8px; width: min(900px, calc(100vw - 16px)); background: var(--panel);
  border-radius: 10px; box-shadow: var(--pop-shadow); transform: translateX(calc(100% + 16px)); transition: transform .2s cubic-bezier(.2,.8,.2,1);
  display: flex; flex-direction: column; z-index: 21; overflow: hidden;
}
.peek.on { transform: none; }
.ph { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 10px 0 18px; border-bottom: 1px solid var(--border); flex: none; }
.ph .path { display: flex; align-items: center; gap: 6px; color: var(--muted); min-width: 0; white-space: nowrap; }
.ph .path b { color: var(--text); font-weight: 500; }
.pbody { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 268px; }
.pmain { overflow-y: auto; padding: 26px 36px 40px; }
.pmain h1 { font-size: 20px; line-height: 1.35; margin: 0 0 10px; font-weight: 600; letter-spacing: -.01em; word-break: break-word; }
.psum { color: var(--text-2); font-size: 14px; line-height: 1.65; margin: 0 0 22px; white-space: pre-wrap; }
.psec { margin-top: 26px; }
.psec > h4 { font-size: 13px; font-weight: 600; margin: 0 0 10px; display: flex; align-items: center; gap: 8px; }
.psec > h4 .n { color: var(--muted); font-weight: 400; }
.attrs { display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; }
.attrs dt { color: var(--muted); }
.attrs dd { margin: 0; word-break: break-word; }
.tl { position: relative; padding-left: 4px; }
.tl-item { display: flex; gap: 10px; padding: 6px 0; position: relative; }
.tl-item::before { content: ""; position: absolute; left: 10px; top: 30px; bottom: -6px; width: 1px; background: var(--border-2); }
.tl-item:last-child::before { display: none; }
.tl-body { flex: 1; min-width: 0; }
.tl-head { color: var(--muted); font-size: 12px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-height: 22px; }
.tl-head b { color: var(--text); font-weight: 500; }
.bubble { margin-top: 4px; border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; white-space: pre-wrap; word-break: break-word; background: var(--bg); }
.bubble.inner { border-color: var(--accent-soft); background: var(--accent-soft); }
.tl-ico { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--panel); border: 1px solid var(--border-2); color: var(--muted); flex: none; position: relative; z-index: 1; }
.code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; color: var(--muted); word-break: break-all; }
.pside { border-left: 1px solid var(--border); overflow-y: auto; padding: 16px 14px; background: var(--sidebar); }
.prop { display: grid; grid-template-columns: 74px 1fr; align-items: center; gap: 8px; min-height: 32px; }
.prop > span:first-child { color: var(--muted); }
.pbtn { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: 6px; min-width: 0; text-align: left; }
.pbtn:hover { background: var(--hover); }
.pbtn .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pval { padding: 4px 8px; word-break: break-word; }
.pdiv { height: 1px; background: var(--border); margin: 12px 0; }
.conf { display: inline-flex; align-items: center; gap: 8px; }
.conf i { width: 60px; height: 4px; border-radius: 2px; background: var(--border-2); position: relative; overflow: hidden; }
.conf i b { position: absolute; inset: 0 auto 0 0; background: var(--accent); }

/* ---------------------------------------------------------------- popover */
.pop { position: fixed; z-index: 40; min-width: 220px; max-width: 320px; background: var(--panel); border-radius: 8px; box-shadow: var(--pop-shadow); display: none; overflow: hidden; }
.pop.on { display: block; }
.pop .pin { display: flex; align-items: center; gap: 8px; padding: 0 12px; height: 38px; border-bottom: 1px solid var(--border); }
.pop .pin input { border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; }
.pop .plist { max-height: 320px; overflow-y: auto; padding: 4px; }
.pop .opt { display: flex; align-items: center; gap: 9px; width: 100%; height: 32px; padding: 0 8px; border-radius: 5px; text-align: left; color: var(--text-2); }
.pop .opt.sel { background: var(--hover); color: var(--text); }
.pop .opt .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pop .opt .h { color: var(--muted); font-size: 12px; }
.pop .opt .chk { color: var(--accent); }
.pop .none { color: var(--muted); padding: 10px 12px; }
.pop .panel { padding: 12px; display: grid; gap: 12px; width: 280px; }
.pop .panel .r { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pop .panel .r > span { color: var(--muted); }
.pop .panel select { height: 28px; border: 1px solid var(--border-2); border-radius: 6px; background: var(--bg); padding: 0 6px; min-width: 130px; }
.pop .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.pop .layout button { border: 1px solid var(--border-2); border-radius: 6px; height: 54px; display: grid; place-items: center; gap: 2px; color: var(--muted); font-size: 12px; padding: 6px 0; }
.pop .layout button[aria-pressed="true"] { border-color: var(--accent); color: var(--text); background: var(--accent-soft); }
.pop .sep { height: 1px; background: var(--border); margin: 0 -12px; }
.pop .panel .acts { display: flex; gap: 6px; flex-wrap: wrap; }

.toast { position: fixed; left: 50%; bottom: 20px; transform: translate(-50%, 8px); background: var(--panel); color: var(--text); box-shadow: var(--pop-shadow); border-radius: 8px; padding: 8px 14px; font-size: 13px; opacity: 0; transition: opacity .15s, transform .15s; pointer-events: none; z-index: 50; display: flex; gap: 8px; align-items: center; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast.err { color: var(--urgent); }

/* ---------------------------------------------------------------- responsive */
@media (max-width: 1100px) { .stats { display: none; } }
@media (max-width: 860px) {
  .app { grid-template-columns: 1fr; }
  .sidebar { position: fixed; inset: 0 auto 0 0; width: 260px; z-index: 30; transform: translateX(-100%); transition: transform .18s; box-shadow: var(--pop-shadow); }
  .sidebar.on { transform: none; }
  .only-mobile { display: grid; }
  .search { width: auto; flex: 1; min-width: 0; }
  .topbar .crumb .count, .topbar .spacer { display: none; }
  .topbar { padding: 0 10px; }
  .filterbar { padding: 6px 10px; }
  .row { padding: 0 10px; gap: 8px; }
  .ghead { padding: 0 10px 0 6px; }
  .ident, .rmeta .cust, .rmeta .typ { display: none; }
  .gt-head, .gt-row { grid-template-columns: minmax(0, 1fr) 70px 64px; padding: 0 10px; }
  .gt-types, .gt-msgs, .gt-head .c-types, .gt-head .c-msgs { display: none; }
  .chat { padding: 4px 8px 40px; }
  .chat-btn { opacity: 1; }
  .kanban { padding: 10px; }
  .kcol { width: 82vw; }
  .peek { top: 0; right: 0; bottom: 0; width: 100vw; border-radius: 0; }
  .pbody { grid-template-columns: 1fr; overflow-y: auto; display: block; }
  .pmain { overflow: visible; padding: 18px 16px 8px; }
  .pside { border-left: 0; border-top: 1px solid var(--border); overflow: visible; }
  .kbd { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar" aria-label="导航">
    <div class="ws"><div class="logo">售</div><div class="name" id="ws-name"></div>
      <button class="icon-btn" id="btn-theme" title="切换明暗主题" aria-label="切换明暗主题"></button></div>
    <div class="side-scroll">
      <nav id="nav-views"></nav>
      <div class="nav-sec">事件类型</div>
      <nav id="nav-types"></nav>
      <div class="nav-sec">客户群</div>
      <nav id="nav-groups"></nav>
      <div class="nav-sec">系统</div>
      <nav id="nav-system"></nav>
    </div>
    <div class="side-foot"><span class="sync" id="sync"></span><span class="sync" id="pipeline"></span></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn only-mobile" id="btn-menu" aria-label="打开导航"></button>
      <div class="crumb"><span id="view-icon"></span><span id="view-name"></span><span class="count" id="view-count"></span></div>
      <div class="spacer"></div>
      <label class="search"><span id="search-ico"></span><input id="q" type="search" placeholder="搜索事件" aria-label="搜索事件" autocomplete="off"><span class="kbd">/</span></label>
      <div class="seg" id="layout-seg" role="group" aria-label="布局"></div>
      <button class="btn" id="btn-display"><span id="display-ico"></span><span>显示</span></button>
    </header>
    <div class="filterbar" id="filterbar"></div>
    <div class="content" id="content" tabindex="-1"></div>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<section class="peek" id="peek" role="dialog" aria-modal="false" aria-label="事件详情" aria-hidden="true"></section>
<div class="pop" id="pop" role="dialog"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="application/json" id="aes-data">__AES_DATA__</script>
<script>
(function () {
  "use strict";
  let D = JSON.parse(document.getElementById("aes-data").textContent);
  const API = !!D.api;
  const $ = (s, el) => (el || document).querySelector(s);
  const $$ = (s, el) => Array.from((el || document).querySelectorAll(s));
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* 隐私模式等情况下忽略 */ } },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  };

  // ============================================================ 图标
  const I = {
    stack: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="2.5" width="11" height="11" rx="2.5"/><path d="M5.5 6h5M5.5 8.5h5M5.5 11h3" stroke-linecap="round"/></svg>',
    open: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="5.5"/><path d="M8 4.8a3.2 3.2 0 0 1 0 6.4z" fill="currentColor" stroke="none"/></svg>',
    fire: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="2.5" width="11" height="11" rx="2.5"/><path d="M8 5v3.6" stroke-linecap="round"/><circle cx="8" cy="10.8" r=".6" fill="currentColor"/></svg>',
    clock: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="5.5"/><path d="M8 5v3.2l2 1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    user: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="5.8" stroke-dasharray="2 1.6"/></svg>',
    users: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="6" cy="6" r="2.3"/><path d="M2.5 12.5c.5-2 1.9-3 3.5-3s3 1 3.5 3" stroke-linecap="round"/><path d="M10.3 4.2a2.2 2.2 0 0 1 0 3.9M11.6 9.7c1 .4 1.6 1.3 1.9 2.8" stroke-linecap="round"/></svg>',
    search: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3 3" stroke-linecap="round"/></svg>',
    list: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg>',
    board: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2.5" width="3.5" height="11" rx="1"/><rect x="6.25" y="2.5" width="3.5" height="7" rx="1"/><rect x="10.5" y="2.5" width="3.5" height="9" rx="1"/></svg>',
    sliders: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 4.5h6M11.5 4.5h2M2.5 11.5h2M7.5 11.5h6"/><circle cx="10" cy="4.5" r="1.5"/><circle cx="6" cy="11.5" r="1.5"/></svg>',
    filter: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 4h11M4.5 8h7M6.5 12h3"/></svg>',
    x: '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="m3 3 6 6M9 3 3 9"/></svg>',
    caret: '<svg width="10" height="10" viewBox="0 0 10 10" fill="currentColor"><path d="M2 3.2h6L5 7.2z"/></svg>',
    chevR: '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="m4.5 2.5 3.5 3.5-3.5 3.5"/></svg>',
    up: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4 10 4-4 4 4"/></svg>',
    down: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4 6 4 4 4-4"/></svg>',
    check: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m3.5 8.5 3 3 6-7"/></svg>',
    menu: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></svg>',
    gear: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="8" cy="8" r="2.2"/><path d="M8 1.8v1.6M8 12.6v1.6M14.2 8h-1.6M3.4 8H1.8M12.4 3.6l-1.1 1.1M4.7 11.3l-1.1 1.1M12.4 12.4l-1.1-1.1M4.7 4.7 3.6 3.6" stroke-linecap="round"/></svg>',
    theme: '<svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="5.6" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 2.4a5.6 5.6 0 0 1 0 11.2z" fill="currentColor"/></svg>',
    spark: '<svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M8 1.5 9.6 6.4 14.5 8 9.6 9.6 8 14.5 6.4 9.6 1.5 8l4.9-1.6z"/></svg>',
    msg: '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/></svg>',
    pen: '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M10.5 2.5 13.5 5.5 6 13H3v-3z"/></svg>',
  };
  function statusIcon(s, size) {
    const z = size || 14;
    const k = { "新建": "todo", "跟进中": "prog", "已解决": "done", "已关闭": "closed" }[s] || "todo";
    if (k === "todo") return `<svg width="${z}" height="${z}" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="none" stroke="var(--s-new)" stroke-width="1.5"/></svg>`;
    if (k === "prog") return `<svg width="${z}" height="${z}" viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="none" stroke="var(--s-prog)" stroke-width="1.5"/><path d="M7 3.6a3.4 3.4 0 0 1 0 6.8z" fill="var(--s-prog)"/></svg>`;
    if (k === "done") return `<svg width="${z}" height="${z}" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6.2" fill="var(--s-done)"/><path d="m4.4 7.2 1.8 1.8 3.4-3.7" fill="none" stroke="var(--panel)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
    return `<svg width="${z}" height="${z}" viewBox="0 0 14 14"><circle cx="7" cy="7" r="6.2" fill="var(--s-closed)"/><path d="m5 5 4 4M9 5 5 9" stroke="var(--panel)" stroke-width="1.5" stroke-linecap="round"/></svg>`;
  }
  function priIcon(l) {
    if (l === "P0") return '<svg width="14" height="14" viewBox="0 0 14 14"><rect x="1" y="1" width="12" height="12" rx="3" fill="var(--urgent)"/><path d="M7 3.8v3.9" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><circle cx="7" cy="10.1" r=".95" fill="#fff"/></svg>';
    const on = { P1: 3, P2: 2, P3: 1 }[l] || 0;
    return '<svg width="14" height="14" viewBox="0 0 14 14">' + [4, 7, 10].map((h, i) =>
      `<rect x="${1.5 + i * 4}" y="${12 - h}" width="3" height="${h}" rx=".8" fill="${i < on ? "var(--text-2)" : "var(--faint)"}"/>`).join("") + "</svg>";
  }
  const hue = s => { let h = 0; for (const c of String(s)) h = (h * 31 + c.codePointAt(0)) % 360; return h; };
  const avatar = (name, cls) => name
    ? `<span class="av ${cls || ""}" style="--h:${hue(name)}" title="${esc(name)}">${esc(Array.from(name)[0].toUpperCase())}</span>`
    : `<span class="muted" title="未分配">${I.user}</span>`;
  const TYPE_COLOR = Object.fromEntries(D.types.map((t, i) => [t.name, `var(--t${i % 8})`]));
  const dot = t => `<span class="dot" style="--c:${TYPE_COLOR[t] || "var(--t7)"}"></span>`;
  $("#btn-theme").innerHTML = I.theme;
  $("#btn-menu").innerHTML = I.menu;
  $("#search-ico").innerHTML = I.search;
  $("#display-ico").innerHTML = I.sliders;

  // ============================================================ 数据
  const NONE = "未分配";
  const OPEN = new Set(["新建", "跟进中"]);
  const LEVEL_NAME = { P0: "紧急", P1: "高", P2: "中", P3: "低" };
  const LV = { P0: 0, P1: 1, P2: 2, P3: 3 };
  const LKEY = "aes-board:" + D.board_id;
  let edits = API ? (D.edits || {}) : store.get(LKEY, {});
  let history = D.history || {};
  let ALL = [];
  let BY_ID = {};
  const PUSH = () => Object.fromEntries(D.types.map(t => [t.name, t.push_to]));

  function recompute() {
    ALL = D.events.map(e => Object.assign({}, e, edits[e.event_id] || {}));
    BY_ID = Object.fromEntries(ALL.map(e => [e.event_id, e]));
    buildGroups();
  }
  const orig = id => D.events.find(e => e.event_id === id);
  const ident = e => "AS-" + e.event_id.replace(/^evt_/, "").slice(0, 4).toUpperCase();
  const staleH = iso => (Date.now() - parseT(iso).getTime()) / 36e5;
  const isStale = e => OPEN.has(e.status) && staleH(e.end_time) > 24;
  function ownerList() {
    const n = {};
    ALL.forEach(e => { if (e.owner) n[e.owner] = (n[e.owner] || 0) + 1; });
    return Object.keys(n).sort((a, b) => n[b] - n[a] || a.localeCompare(b, "zh"));
  }
  const cleanName = n => String(n || "").replace(/\s*<[^<>]*>\s*$/, "").replace(/[\s\-_]+$/, "") || n || "";
  // 每个群：消息概况（来自原始数据）+ 事件概况（来自事件）
  let GROUPS = [], GBY = {};
  function buildGroups() {
    const g = {};
    (D.groups || []).forEach(x => { g[x.id] = Object.assign({}, x, { events: [] }); });
    ALL.forEach(e => {
      const x = g[e.group_number] || (g[e.group_number] = { id: e.group_number, name: cleanName(e.group_name), raw_name: e.group_name, uid: e.customer_uid, messages: null, last: e.end_time, events: [] });
      x.events.push(e);
    });
    GROUPS = Object.values(g).map(x => {
      const open = x.events.filter(e => OPEN.has(e.status));
      const types = {};
      open.forEach(e => { types[e.type] = (types[e.type] || 0) + 1; });
      const lastEvent = x.events.reduce((m, e) => (e.end_time > m ? e.end_time : m), "");
      return Object.assign(x, { open: open.length, total: x.events.length, top: open.reduce((m, e) => Math.min(m, LV[e.level]), 9), types,
        last: [x.last, lastEvent].filter(Boolean).sort().pop() || "", stale: open.filter(isStale).length });
    });
    GBY = Object.fromEntries(GROUPS.map(x => [x.id, x]));
  }
  const byAttention = (a, b) => a.top - b.top || b.open - a.open || (b.last > a.last ? 1 : -1);
  const groupList = () => GROUPS.slice().sort((a, b) => b.total - a.total || byAttention(a, b));
  const groupLabel = id => { const g = GBY[id]; return g ? (g.uid ? `${g.name} · ${g.uid}` : g.name) : id; };
  const gname = e => cleanName(e.group_name);
  const gav = (id, name, size) => `<span class="gav" style="--h:${hue(id)}${size ? `;width:${size}px;height:${size}px;font-size:${Math.round(size / 2)}px;border-radius:4px` : ""}">${esc(Array.from(cleanName(name) || "?").find(c => /[\p{L}\p{N}]/u.test(c)) || "#")}</span>`;

  const p2 = n => String(n).padStart(2, "0");
  // 数据里的时间不带时区（业务时区本地时间）：补上服务端给的偏移再解析
  const TZ = (() => { const m = D.tz_offset_minutes; if (typeof m !== "number") return ""; const a = Math.abs(m); return (m < 0 ? "-" : "+") + p2(Math.floor(a / 60)) + ":" + p2(a % 60); })();
  const parseT = iso => new Date(iso && TZ && /T\d{2}:\d{2}(:\d{2}(\.\d+)?)?$/.test(iso) ? iso + TZ : iso);
  // 显示统一用业务时区的钟点（和聊天记录原文一致），不受浏览器所在时区影响
  function wall(iso) {
    const d = parseT(iso);
    if (isNaN(d)) return null;
    if (typeof D.tz_offset_minutes !== "number") return { y: d.getFullYear(), mo: d.getMonth() + 1, d: d.getDate(), h: d.getHours(), mi: d.getMinutes() };
    const x = new Date(d.getTime() + D.tz_offset_minutes * 6e4);
    return { y: x.getUTCFullYear(), mo: x.getUTCMonth() + 1, d: x.getUTCDate(), h: x.getUTCHours(), mi: x.getUTCMinutes() };
  }
  function fmtDate(iso) { const w = wall(iso); return w ? `${w.mo}月${w.d}日` : ""; }
  function fmtFull(iso) { const w = wall(iso); return w ? `${w.y}-${p2(w.mo)}-${p2(w.d)} ${p2(w.h)}:${p2(w.mi)}` : (iso || ""); }
  function ago(iso) {
    const ms = Date.now() - parseT(iso).getTime();
    if (!(ms > 0)) return fmtDate(iso);
    const m = ms / 6e4;
    if (m < 1) return "刚刚";
    if (m < 60) return Math.round(m) + " 分钟前";
    if (m < 60 * 24) return Math.round(m / 60) + " 小时前";
    if (m < 60 * 24 * 30) return Math.round(m / 1440) + " 天前";
    return fmtDate(iso);
  }

  // ============================================================ 视图 / 筛选 / 分组
  const VIEWS = [
    { key: "all", label: "全部事件", icon: I.stack, test: () => true },
    { key: "open", label: "未关闭", icon: I.open, test: e => OPEN.has(e.status) },
    { key: "urgent", label: "高优先级", icon: I.fire, test: e => OPEN.has(e.status) && LV[e.level] <= 1 },
    { key: "stale", label: "超 24h 无动态", icon: I.clock, test: isStale },
    { key: "unassigned", label: "未分配", icon: I.user, test: e => OPEN.has(e.status) && !e.owner },
  ];
  const FIELDS = {
    status: { label: "状态", values: () => D.statuses, get: e => e.status, icon: v => statusIcon(v), text: v => v },
    level: { label: "优先级", values: () => D.levels, get: e => e.level, icon: v => priIcon(v), text: v => LEVEL_NAME[v] || v, hint: v => v },
    type: { label: "类型", values: () => D.types.map(t => t.name), get: e => e.type, icon: v => dot(v), text: v => v, hint: v => PUSH()[v] ? "→ " + PUSH()[v] : "" },
    owner: { label: "跟进人", values: () => ownerList().concat([NONE]), get: e => e.owner || NONE, icon: v => avatar(v === NONE ? null : v), text: v => v },
    group: { label: "客户群", values: () => groupList().filter(g => g.total).map(g => g.id), get: e => e.group_number, icon: v => gav(v, (GBY[v] || {}).name || v, 16), text: groupLabel },
  };
  const GROUPINGS = [["status", "状态"], ["type", "类型"], ["level", "优先级"], ["owner", "跟进人"], ["none", "不分组"]];
  const SORTS = [["priority", "优先级"], ["updated", "最近消息"], ["created", "首次出现"], ["confidence", "置信度"]];

  const ui = Object.assign({ page: "events", view: "all", layout: "list", group: "status", sort: "priority", q: "", f: {}, collapsed: [], showEmpty: false, gfilter: "all", gsort: "attention" },
    store.get("aes-board:ui2", {}));
  if (!VIEWS.some(v => v.key === ui.view)) ui.view = "all";
  if (!["events", "groups", "settings"].includes(ui.page)) ui.page = "events";
  let cursor = null, current = null, order = [];
  // 聊天记录：按天加载，days 从旧到新；往上翻加载更早的一天，往下翻加载更新的一天（像微信）
  const chat = { gid: null, name: "", days: [], role: "all", focus: [], seq: 0, upBusy: false, downBusy: false,
                 upError: null, downError: null, emptyStreak: 0, exhausted: false, initError: null, atBottom: true };
  const MAX_EMPTY_DAYS = 7;
  const saveUi = () => store.set("aes-board:ui2", Object.assign({}, ui, { q: "", page: ui.page === "chat" ? "groups" : ui.page }));

  function filtered() {
    const view = VIEWS.find(v => v.key === ui.view);
    const words = ui.q.toLowerCase().split(/\s+/).filter(Boolean);
    return ALL.filter(e => {
      if (!view.test(e)) return false;
      for (const [k, vals] of Object.entries(ui.f)) if (vals && vals.length && !vals.includes(FIELDS[k].get(e))) return false;
      if (words.length) {
        const hay = [ident(e), e.title, e.summary, e.group_name, e.customer_uid, e.owner, e.type, ...Object.entries(e.attributes || {}).flat()].join(" ").toLowerCase();
        if (!words.every(w => hay.includes(w))) return false;
      }
      return true;
    });
  }
  function sorted(list) {
    const by = {
      priority: (a, b) => LV[a.level] - LV[b.level] || (b.end_time > a.end_time ? 1 : -1),
      updated: (a, b) => (b.end_time > a.end_time ? 1 : -1),
      created: (a, b) => (b.start_time > a.start_time ? 1 : -1),
      confidence: (a, b) => b.confidence - a.confidence,
    }[ui.sort] || (() => 0);
    return list.slice().sort(by);
  }
  function grouped(list, dimKey) {
    const k = dimKey || ui.group;
    if (k === "none") return [{ key: "__all", label: "全部事件", icon: I.stack, items: list }];
    const F = FIELDS[k];
    const vals = F.values();
    const extra = [...new Set(list.map(F.get))].filter(v => !vals.includes(v));
    return vals.concat(extra).map(v => ({ key: v, label: F.text(v), icon: F.icon(v), hint: F.hint ? F.hint(v) : "", items: list.filter(e => F.get(e) === v) }));
  }

  // ============================================================ 渲染
  function render() {
    recompute();
    renderSidebar();
    renderTop();
    $("#filterbar").style.display = ui.page === "settings" ? "none" : "";
    if (ui.page === "groups") { renderGroupsBar(); renderGroups(); }
    else if (ui.page === "settings") renderSettings();
    else if (ui.page === "chat") { renderChatBar(); renderChat(); }
    else { renderFilterbar(); renderContent(); }
    if (current) renderPeek();
    saveUi();
  }

  function navItem(attrs, icon, label, n, active) {
    return `<button class="nav-item" ${attrs} aria-current="${!!active}"><span class="ico">${icon}</span><span class="lab">${esc(label)}</span><span class="n">${n}</span></button>`;
  }
  function renderSidebar() {
    $("#ws-name").textContent = D.title;
    const onlyFilter = k => Object.keys(ui.f).filter(x => ui.f[x] && ui.f[x].length).join() === k && ui.f[k].length === 1 ? ui.f[k][0] : null;
    const onlyType = onlyFilter("type"), onlyGroup = onlyFilter("group");
    const noFilter = !Object.values(ui.f).some(v => v && v.length);
    const ev = ui.page === "events";
    $("#nav-views").innerHTML = VIEWS.map(v => navItem(`data-view="${v.key}"`, v.icon, v.label, ALL.filter(v.test).length, ev && ui.view === v.key && noFilter)).join("");
    $("#nav-types").innerHTML = D.types.map(t => navItem(`data-type="${esc(t.name)}" title="${esc(t.push_to ? "推送：" + t.push_to : "")}"`, dot(t.name), t.name,
      ALL.filter(e => e.type === t.name && OPEN.has(e.status)).length || "", ev && onlyType === t.name)).join("");
    // 侧边栏只列最需要关注的群：有未关闭事件的优先，按最高优先级、未关闭数排序
    const focus = GROUPS.filter(g => g.open).sort(byAttention).slice(0, 8);
    $("#nav-groups").innerHTML = navItem(`data-page="groups"`, I.users, "全部客户群", GROUPS.length, ui.page === "groups") +
      focus.map(g => navItem(`data-group="${esc(g.id)}" title="${esc(g.raw_name || g.name)}"`, gav(g.id, g.name, 16), g.name, g.open, ev && onlyGroup === g.id)).join("");
    const ms = D.model_settings || {};
    $("#nav-system").innerHTML = navItem(`data-page="settings"`, I.gear, "设置", ms.selected && ms.selected !== ms.in_use ? "待生效" : "", ui.page === "settings");
    renderPipeline();
    const times = D.events.map(e => e.end_time).sort();
    $("#sync").innerHTML = API
      ? `<span class="dotlive" id="live"></span><span>已同步 · ${esc(fmtFull(D.generated_at).slice(5))}</span>`
      : `<span class="dotlive off"></span><span title="修改只保存在当前浏览器">本地模式${times.length ? " · 数据截至 " + esc(fmtFull(times[times.length - 1]).slice(5)) : ""}</span>`;
  }

  function renderPipeline() {
    const sy = D.sync, el = $("#pipeline");
    if (!sy || !sy.finished_at) { el.innerHTML = ""; return; }
    const tip = [`上次处理：${fmtFull(sy.finished_at)}（耗时 ${sy.duration_seconds}s）`, `日期：${(sy.dates || []).join("、")}`,
      `窗口 ${sy.windows}：新处理 ${sy.extracted}，复用缓存 ${sy.cached}${sy.failed ? `，失败 ${sy.failed}` : ""}${sy.deferred ? `，延后 ${sy.deferred}` : ""}`,
      `事件 ${sy.events}（${sy.groups_with_events} 个群）`, ...(sy.errors || [])].join("\n");
    const late = staleH(sy.finished_at) > 2;
    const bad = !sy.ok || late;
    el.innerHTML = `<span class="dotlive${bad ? " warn" : ""}"></span><span title="${esc(tip)}">${bad ? (late ? "数据超过 2 小时未更新" : "上次处理有错误") : "数据处理于 " + esc(ago(sy.finished_at))}${sy.extracted ? ` · 新增 ${sy.extracted} 段对话` : ""}</span>`;
  }

  function renderTop() {
    if (ui.page === "chat") {
      const g = GBY[chat.gid];
      $("#view-icon").innerHTML = `<span class="muted">${I.msg}</span>`;
      $("#view-name").innerHTML = `<button class="btn ghost" data-page-go="groups" style="padding:0 4px;height:24px;color:var(--muted)">客户群</button>${I.chevR}<span>${esc(g ? g.name : chat.name || chat.gid)}</span><span class="muted" style="font-weight:400">· 聊天记录</span>`;
      $("#view-count").textContent = "";
      $("#layout-seg").style.display = "none";
      $("#btn-display").style.display = "none";
      $(".search").style.display = "";
      $("#q").placeholder = "搜索消息内容或发送人";
      return;
    }
    if (ui.page === "settings") {
      $("#view-icon").innerHTML = `<span class="muted">${I.gear}</span>`;
      $("#view-name").textContent = "设置";
      $("#view-count").textContent = "";
      $("#layout-seg").style.display = "none";
      $("#btn-display").style.display = "none";
      $(".search").style.display = "none";
      return;
    }
    $(".search").style.display = "";
    $("#view-name").textContent = "";
    if (ui.page === "groups") {
      $("#view-icon").innerHTML = `<span class="muted">${I.users}</span>`;
      $("#view-name").textContent = "客户群";
      $("#view-count").textContent = GROUPS.length;
      $("#layout-seg").style.display = "none";
      $("#btn-display").style.display = "none";
      setPlaceholder();
      return;
    }
    $("#layout-seg").style.display = "";
    $("#btn-display").style.display = "";
    const view = VIEWS.find(v => v.key === ui.view);
    $("#view-icon").innerHTML = `<span class="muted">${view.icon}</span>`;
    $("#view-name").textContent = view.label;
    $("#view-count").textContent = filtered().length;
    setPlaceholder();
    $("#layout-seg").innerHTML = [["list", "列表", I.list], ["board", "看板", I.board]].map(([k, l, ic]) =>
      `<button data-layout="${k}" aria-pressed="${ui.layout === k}" title="${l}（Ctrl+B 切换）" aria-label="${l}">${ic}</button>`).join("");
  }

  function renderFilterbar() {
    const chips = Object.entries(ui.f).filter(([, v]) => v && v.length).map(([k, vals]) => {
      const F = FIELDS[k];
      const v = vals.length === 1 ? `${F.icon(vals[0])}<span>${esc(F.text(vals[0]))}</span>` : `<span>${vals.length} 项</span>`;
      return `<span class="fchip"><span class="k">${esc(F.label)}</span><span class="op">${vals.length > 1 ? "属于" : "是"}</span><button class="v" data-edit-filter="${k}">${v}</button><button data-clear-filter="${k}" aria-label="移除筛选">${I.x}</button></span>`;
    }).join("");
    const list = filtered();
    const open = list.filter(e => OPEN.has(e.status));
    const urgent = open.filter(e => LV[e.level] <= 1).length;
    const stale = open.filter(isStale).length;
    const oneGroup = (ui.f.group || []).length === 1 ? ui.f.group[0] : null;
    $("#filterbar").innerHTML = chips + `<button class="fadd" id="btn-filter">${I.filter}<span>筛选</span></button>` +
      (oneGroup && API ? `<button class="fadd" data-chat-gid="${esc(oneGroup)}">${I.msg}<span>聊天记录</span></button>` : "") +
      (chips ? `<button class="fadd" id="btn-clear">清除</button>` : "") +
      `<span class="stats"><span>未关闭 <b>${open.length}</b></span><span class="${urgent ? "hot" : ""}">紧急/高 <b>${urgent}</b></span><span class="${stale ? "hot" : ""}">超 24h 无动态 <b>${stale}</b></span><span>客户 <b>${new Set(list.map(e => e.group_number)).size}</b></span></span>`;
  }

  const GFILTERS = [["all", "全部", () => true], ["open", "有未关闭事件", g => g.open > 0], ["active", "最近 24h 有消息", g => g.recent_24h > 0 || staleH(g.last) < 24], ["quiet", "无事件", g => !g.total]];
  const GSORTS = [["attention", "需关注优先", byAttention], ["recent", "最近消息", (a, b) => (b.last > a.last ? 1 : -1)], ["messages", "消息数", (a, b) => (b.messages || 0) - (a.messages || 0)], ["events", "事件数", (a, b) => b.total - a.total || byAttention(a, b)]];
  function groupsFiltered() {
    const f = (GFILTERS.find(x => x[0] === ui.gfilter) || GFILTERS[0])[2];
    const words = ui.q.toLowerCase().split(/\s+/).filter(Boolean);
    const srt = (GSORTS.find(x => x[0] === ui.gsort) || GSORTS[0])[2];
    return GROUPS.filter(g => f(g) && (!words.length || words.every(w => [g.name, g.raw_name, g.uid, g.id].join(" ").toLowerCase().includes(w)))).sort(srt);
  }
  function renderGroupsBar() {
    const n = k => GROUPS.filter((GFILTERS.find(x => x[0] === k) || GFILTERS[0])[2]).length;
    const msgs = GROUPS.reduce((s, g) => s + (g.messages || 0), 0);
    $("#filterbar").innerHTML = `<span class="gseg" id="gfilter">${GFILTERS.map(([k, l]) => `<button data-gf="${k}" aria-pressed="${ui.gfilter === k}">${l} <span class="muted">${n(k)}</span></button>`).join("")}</span>
      <select class="gsort" id="gsort" aria-label="排序">${GSORTS.map(([k, l]) => `<option value="${k}"${ui.gsort === k ? " selected" : ""}>按${l}</option>`).join("")}</select>
      <span class="stats"><span>群 <b>${GROUPS.length}</b></span><span>消息 <b>${msgs}</b></span><span>有未关闭事件 <b>${n("open")}</b></span></span>`;
  }
  function renderGroups() {
    order = [];
    const list = groupsFiltered();
    if (!GROUPS.length) { $("#content").innerHTML = `<div class="empty"><div class="muted">${I.users}</div><h3>还没有群数据</h3><p>运行 <code>aes sync</code> 拉取聊天记录后，这里会列出每个群的情况。</p></div>`; return; }
    if (!list.length) { $("#content").innerHTML = `<div class="empty"><div class="muted">${I.search}</div><h3>没有符合条件的群</h3></div>`; return; }
    const tn = Object.fromEntries(D.types.map(t => [t.name, t]));
    $("#content").innerHTML = `<div class="gt-head"><span>客户群</span><span>未关闭 / 全部事件</span><span class="c-types">未关闭事件类型</span><span class="c-msgs">消息（24h）</span><span>最近消息</span></div>` +
      list.map(g => `<div class="gt-row" data-gid="${esc(g.id)}" title="${esc(g.raw_name || g.name)}">
        <span class="gt-name">${gav(g.id, g.name)}<span class="t">${esc(g.name)}</span>${g.uid ? `<span class="muted">${esc(g.uid)}</span>` : ""}${API ? `<button class="ib chat-btn" data-chat-gid="${esc(g.id)}" title="查看聊天记录" aria-label="查看聊天记录">${I.msg}</button>` : ""}</span>
        <span class="gt-open">${g.open ? priIcon(D.levels[g.top]) : `<span style="width:14px"></span>`}<b>${g.open || "–"}</b><span class="muted">/ ${g.total}</span>${g.stale ? `<span class="date stale" style="width:auto" title="${g.stale} 个事件超过 24 小时无动态">${I.clock}</span>` : ""}</span>
        <span class="gt-types">${Object.entries(g.types).sort((a, b) => b[1] - a[1]).map(([t, c]) => `<span title="${esc(t)}${tn[t] && tn[t].push_to ? " → " + esc(tn[t].push_to) : ""}">${dot(t)}${esc(t)} ${c}</span>`).join("") || `<span class="muted">–</span>`}</span>
        <span class="gt-msgs" title="${g.messages == null ? "" : `内部 ${g.inner} · 客户 ${g.customer} · ${g.senders} 人发言${g.images ? ` · 图片 ${g.images}` : ""}`}">${g.messages == null ? "–" : `${g.messages}<span class="muted">（${g.recent_24h}）</span>`}</span>
        <span class="gt-last${staleH(g.last) < 2 ? " hot" : ""}" title="${esc(fmtFull(g.last))}">${esc(g.last ? ago(g.last) : "–")}</span>
      </div>`).join("");
  }

  // ============================================================ 聊天记录（实时获取，不在服务器存储）
  const shiftDate = (d, n) => { const x = new Date(d + "T12:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0, 10); };
  const todayStr = () => D.today || new Date().toISOString().slice(0, 10);
  const WEEK = ["日", "一", "二", "三", "四", "五", "六"];
  const dayTitle = d => { const x = new Date(d + "T12:00:00Z"); return `${x.getUTCMonth() + 1}月${x.getUTCDate()}日 周${WEEK[x.getUTCDay()]}${d === todayStr() ? " · 今天" : d === shiftDate(todayStr(), -1) ? " · 昨天" : ""}`; };
  const chatFirst = () => chat.days.length ? chat.days[0].date : null;
  const chatLast = () => chat.days.length ? chat.days[chat.days.length - 1].date : null;

  async function fetchDay(d, fresh) {
    const r = await fetch(`api/groups/${encodeURIComponent(chat.gid)}/messages?date=${d}${fresh ? "&fresh=1" : ""}`, { cache: "no-store" });
    const body = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(body.error || r.status);
    return body;
  }
  function openChat(gid, date, focus) {
    const g = GBY[gid];
    Object.assign(chat, { gid, name: g ? g.name : "", days: [], role: "all", focus: focus || [], seq: chat.seq + 1, upBusy: false, downBusy: false,
                          upError: null, downError: null, emptyStreak: 0, exhausted: false, initError: null, atBottom: !(focus && focus.length) });
    ui.page = "chat"; ui.q = ""; $("#q").value = "";
    if (current) closePeek();
    render();
    if (!API) { chat.initError = "单文件模式不能查看完整聊天记录，请在服务模式（aes serve）下使用"; return render(); }
    loadInitial(date || todayStr());
  }
  async function loadInitial(d) {
    const seq = chat.seq;
    try {
      const data = await fetchDay(d);
      if (seq !== chat.seq) return;
      if (!chat.name) chat.name = cleanName(data.group.name);
      chat.days = [{ date: d, data }];
      chat.emptyStreak = data.total ? 0 : 1;
    } catch (err) { if (seq === chat.seq) { chat.initError = err.message; render(); } return; }
    render();
    if (chat.focus.length) scrollToFocus(); else scrollChatBottom();
    fillScreen();
  }
  // 内容不满一屏时继续往上加载，直到填满或到头
  function fillScreen() {
    const box = $("#content");
    if (ui.page === "chat" && !chat.exhausted && !chat.upBusy && box.scrollHeight <= box.clientHeight + 80) loadOlder();
  }
  async function loadOlder() {
    if (chat.upBusy || chat.exhausted || !chat.days.length) return;
    const seq = chat.seq, d = shiftDate(chatFirst(), -1);
    chat.upBusy = true; chat.upError = null; renderChatTop();
    try {
      const data = await fetchDay(d);
      if (seq !== chat.seq) return;
      const box = $("#content"), h = box.scrollHeight, top = box.scrollTop;
      chat.days.unshift({ date: d, data });
      chat.emptyStreak = data.total ? 0 : chat.emptyStreak + 1;
      chat.exhausted = chat.emptyStreak >= MAX_EMPTY_DAYS;
      chat.upBusy = false;
      render();
      box.scrollTop = box.scrollHeight - h + top;  // 保持当前看到的位置不跳
      if (!data.total && !chat.exhausted) return loadOlder();  // 空的一天直接跳过
      fillScreen();
    } catch (err) { if (seq === chat.seq) { chat.upBusy = false; chat.upError = err.message; renderChatTop(); } }
  }
  async function loadNewer() {
    if (chat.downBusy || !chat.days.length || chatLast() >= todayStr()) return;
    const seq = chat.seq, d = shiftDate(chatLast(), 1);
    chat.downBusy = true; chat.downError = null;
    try {
      const data = await fetchDay(d);
      if (seq !== chat.seq) return;
      chat.days.push({ date: d, data });
      chat.downBusy = false;
      const box = $("#content"), top = box.scrollTop;
      render();
      box.scrollTop = top;
    } catch (err) { if (seq === chat.seq) { chat.downBusy = false; chat.downError = err.message; render(); } }
  }
  // 停在最新消息时，定时拉取今天的新消息
  async function refreshToday(fresh) {
    if (ui.page !== "chat" || !chat.days.length || chatLast() !== todayStr()) return;
    const seq = chat.seq;
    try {
      const data = await fetchDay(todayStr(), fresh);
      if (seq !== chat.seq) return;
      const last = chat.days[chat.days.length - 1];
      const added = data.total - (last.data ? last.data.total : 0);
      const stick = chat.atBottom;
      last.data = data;
      const box = $("#content"), top = box.scrollTop;
      render();
      if (stick) scrollChatBottom(); else box.scrollTop = top;
      if (fresh) toast(added > 0 ? `新增 ${added} 条消息` : "已是最新");
      else if (added > 0 && !stick) toast(`有 ${added} 条新消息`);
    } catch (err) { if (fresh) toast("刷新失败：" + err.message, true); }
  }
  function scrollChatBottom() { const box = $("#content"); box.scrollTop = box.scrollHeight; chat.atBottom = true; }
  function scrollToFocus() {
    if (!chat.focus.length) return;
    const el = document.querySelector(`.cmsg[data-mid="${CSS.escape(chat.focus[0])}"]`);
    if (el) { el.scrollIntoView({ block: "center" }); chat.focus.forEach(id => { const x = document.querySelector(`.cmsg[data-mid="${CSS.escape(id)}"]`); if (x) x.classList.add("flash"); }); }
    chat.focus = [];
  }
  function chatFilter(msgs, ev) {
    const words = ui.q.toLowerCase().split(/\s+/).filter(Boolean);
    return msgs.filter(m => (chat.role === "all" || (chat.role === "ev" ? !!ev[m.id] : m.role === chat.role)) &&
      (!words.length || words.every(w => (m.content + " " + m.sender).toLowerCase().includes(w))));
  }
  const chatTotals = () => {
    let total = 0, shown = 0, evn = 0;
    chat.days.forEach(({ data }) => {
      if (!data) return;
      const ev = data.evidence || {};
      total += data.total;
      shown += chatFilter(data.messages, ev).length;
      evn += data.messages.filter(m => ev[m.id]).length;
    });
    return { total, shown, evn };
  };
  function renderChatBar() {
    const { total, shown, evn } = chatTotals();
    const range = chat.days.length ? (chatFirst() === chatLast() ? chatFirst() : `${chatFirst().slice(5)} ~ ${chatLast().slice(5)}`) : "";
    const last = chat.days.length ? chat.days[chat.days.length - 1].data : null;
    $("#filterbar").innerHTML = `
      <input type="date" class="cbar-date" id="chat-date" value="${esc(chatLast() || todayStr())}" max="${esc(todayStr())}" aria-label="跳到日期" title="跳到日期">
      ${chatLast() !== todayStr() || !chat.atBottom ? `<button class="fadd" data-chat-latest>回到最新</button>` : ""}
      <span class="gseg" style="margin-left:6px">${[["all", "全部"], ["客户", "客户"], ["内部", "内部"], ["ev", `事件证据 ${evn}`]].map(([k, l]) => `<button data-chat-role="${k}" aria-pressed="${chat.role === k}">${l}</button>`).join("")}</span>

    const filtering = ui.q || chat.role !== "all";

    try {

    const k = ev.key;
    if (k === "/") { ev.preventDefault(); return $("#q").focus(); }
    if (k === "Escape") { if (current) closePeek(); else { cursor = null; markCursor(); } return; }
    if (ui.page !== "events" && !current) return;
    if (k === "j" || k === "ArrowDown") { ev.preventDefault(); return move(1); }
    if (k === "k" || k === "ArrowUp") { ev.preventDefault(); return move(-1); }
    if (k === "Enter" && cursor && !current && !ev.target.closest("button")) { ev.preventDefault(); return openPeek(cursor); }
    if (k === "f") { ev.preventDefault(); return filterMenu($("#btn-filter")); }
    const field = { s: "status", p: "level", a: "owner", t: "type" }[k.toLowerCase()];
    const id = current || cursor;
    if (field && id) { const a = actAnchor(field); if (a) { ev.preventDefault(); fieldMenu(a, id, field); } }
  });

  const root = document.documentElement;
  const savedTheme = store.get("aes-board:theme", "");
  if (savedTheme) root.dataset.theme = savedTheme;
  $("#btn-theme").addEventListener("click", () => {
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    store.set("aes-board:theme", root.dataset.theme);
  });

  // 清理已不存在的筛选值
  recompute();
  for (const k of Object.keys(ui.f)) { if (!FIELDS[k]) delete ui.f[k]; }
  render();
})();
</script>
</body>
</html>
